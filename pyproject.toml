[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripline-scope"
version = "0.1.0"
description = "Breach scoping for South African hospitals and laboratories (POPIA section 22), run on the hospital's own infrastructure."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - all rights reserved (placeholder; owner to confirm)" }
dependencies = [
  "tripline-scope-verify==0.1.0",
  "duckdb>=1.5,<1.6",
  "splink>=5.0,<5.1",
  "pyarrow>=26,<27",
  "rfc8785>=0.1.4,<0.2",
  "cryptography>=50,<51",
  "reportlab>=5.0,<5.1",
  "fastapi>=0.143,<0.144",
  "uvicorn>=0.54,<0.55",
  "python-multipart>=0.0.32,<0.1",
  "argon2-cffi>=25.1,<26",
  "pyotp>=2.10,<3",
  "pyyaml>=6.0,<7",
  "openpyxl>=3.1,<3.2",
  "pg8000>=1.31,<1.32",
  "python-tds>=1.17,<1.18",
  "evtx>=0.13,<0.14",
  "jinja2>=3.1,<3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27", "ruff>=0.6", "cyclonedx-bom>=5"]

[project.scripts]
tscope = "tripline_scope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripline_scope = ["templates/**/*", "sql/**/*", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "verify/src"]
testpaths = ["tests"]
timeout = 900
markers = [
  "docker: needs the local Docker daemon (SQL Server / PostgreSQL containers)",
  "postgres: needs a local PostgreSQL 16 server binary",
  "slow: long-running benchmark or scale test",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "verify/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/tripline_scope/testing.py" = ["S105"]
