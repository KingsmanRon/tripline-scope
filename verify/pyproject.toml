[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripline-scope-verify"
version = "0.1.0"
description = "Offline verifier for Tripline Scope signed reports, release chains, audit logs, destruction certificates and release checksums."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=42", "rfc8785>=0.1.4,<0.2"]

[project.scripts]
tscope-verify = "tscope_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
